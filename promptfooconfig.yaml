# promptfooconfig.yaml — active promptfoo base config for restored local suites
# https://promptfoo.dev/docs/configuration/
#
# Default provider:
# - uses the standard OpenAI provider contract
# - expects OPENAI_API_KEY to be configured in the local environment
# - can be overridden locally if you prefer another provider

description: |
  Active promptfoo base config for restored local skill suites.
  This first restored wave covers the academic core:
  lecture-transcript, homework-management, and case-analyzer.
  Use scripts/run-promptfoo-evals.ps1 or scripts/run-promptfoo-evals.sh
  to compose this base config with each tracked suite file.

providers:
  - id: openai:gpt-4.1-mini
    label: default-openai

defaultTest:
  options:
    maxTokens: 4096

configs:
  - evals/promptfoo/suites/lecture-transcript.yaml
  - evals/promptfoo/suites/homework-management.yaml
  - evals/promptfoo/suites/case-analyzer.yaml
